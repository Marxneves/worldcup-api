services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: worldcup
      POSTGRES_PASSWORD: worldcup
      POSTGRES_DB: worldcup
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U worldcup']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://worldcup:worldcup@db:5432/worldcup
      JWT_SECRET: worldcup2026-dev-secret
      ADMIN_SECRET: admin123
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && npm run dev"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
